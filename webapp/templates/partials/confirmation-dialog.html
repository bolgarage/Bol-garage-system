<dialog class="confirm-dialog" id="confirmation-dialog" aria-labelledby="confirmation-dialog-title" aria-describedby="confirmation-dialog-message">
  <div class="confirm-dialog-content">
    <h2 class="display" id="confirmation-dialog-title">Confirm deletion</h2>
    <p id="confirmation-dialog-message"></p>
    <div class="confirm-dialog-actions">
      <button type="button" class="btn btn-outline btn-small" data-confirmation-cancel>Cancel</button>
      <button type="button" class="btn btn-danger btn-small" data-confirmation-submit>Delete permanently</button>
    </div>
  </div>
</dialog>
